<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0f2b"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="60" r="160" fill="url(#glow1)"/>
  <circle cx="1050" cy="240" r="180" fill="url(#glow2)"/>

  <!-- decorative circuit lines -->
  <g stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M40,40 L120,40 L120,90 L200,90"/>
    <path d="M1160,260 L1080,260 L1080,210 L1000,210"/>
    <path d="M60,260 L140,260 L140,220"/>
    <circle cx="200" cy="90" r="4" fill="#2dd4bf"/>
    <circle cx="1000" cy="210" r="4" fill="#f472b6"/>
    <circle cx="140" cy="220" r="4" fill="#a855f7"/>
  </g>

  <!-- left AI/brain motif (abstract, geometric) -->
  <g transform="translate(90,150)" filter="url(#softGlow)">
    <circle r="46" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8"/>
    <circle r="30" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle r="4" fill="#22d3ee"/>
    <line x1="0" y1="0" x2="40" y2="-22" stroke="#22d3ee" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-38" y2="18" stroke="#a855f7" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="10" y2="42" stroke="#ec4899" stroke-width="1.2"/>
    <circle cx="40" cy="-22" r="4" fill="#22d3ee"/>
    <circle cx="-38" cy="18" r="4" fill="#a855f7"/>
    <circle cx="10" cy="42" r="4" fill="#ec4899"/>
  </g>

  <!-- code brackets motif top-right -->
  <g transform="translate(1080,55)" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M-14,-16 L-28,0 L-14,16"/>
    <path d="M14,-16 L28,0 L14,16"/>
  </g>

  <!-- main title -->
  <text x="600" y="140" font-family="Verdana, Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#softGlow)">
    Sakshi Chaudhary
  </text>
  <text x="600" y="185" font-family="Verdana, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#e2e8f0" text-anchor="middle">
    AI &amp; ML ENGINEER
  </text>
  <text x="600" y="220" font-family="Verdana, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#94a3b8" text-anchor="middle">
    PYTHON &#8226; NLP &#8226; GENERATIVE AI &#8226; DATA ANALYTICS
  </text>

  <!-- bottom divider dots -->
  <g fill="#475569">
    <circle cx="500" cy="255" r="3"/>
    <circle cx="600" cy="255" r="3"/>
    <circle cx="700" cy="255" r="3"/>
  </g>
</svg>
